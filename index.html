<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ASL Alphabet</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
        <script defer src="app.js"></script>
    </head>
    <body>
        <header>
            <h1>ASL Alphabet</h1>
            <p>Show an American Sign Language letter to the webcam.</p>
        </header>
        <main>
            <div>
                <section class="panel" aria-labelledby="camera-heading">
                    <h2 id="camera-heading">Camera</h2>
                    <p id="status" role="status" aria-live="polite"></p>
                    <p class="actions">
                        <button id="start-button" type="button">
                            Start camera
                        </button>
                        <button id="stop-button" type="button">
                            Stop camera
                        </button>
                    </p>
                    <canvas id="canvas" hidden></canvas>
                    <video id="video" playsinline muted hidden></video>
                </section>
                <section class="panel" aria-labelledby="guess-heading">
                    <h2 id="guess-heading">Model guess</h2>
                    <output id="prediction" class="letter">—</output>

                    <form class="training" aria-labelledby="teach-heading">
                        <h2 id="teach-heading">Teach a sign</h2>
                        <p class="actions">
                            <label for="letter-select">Letter</label>
                            <select id="letter-select"></select>
                            <button id="capture-button" type="button">
                                Save example
                            </button>
                            <button id="clear-button" type="button">
                                Clear examples
                            </button>
                        </p>
                        <table>
                            <thead>
                                <tr>
                                    <th>Letter</th>
                                    <th>Examples</th>
                                </tr>
                            </thead>
                            <tbody id="training-count"></tbody>
                        </table>
                    </form>
                </section>
            </div>
            <aside class="panel" aria-labelledby="chart-heading">
                <h2 id="chart-heading">ASL alphabet reference</h2>
                <img
                    src="asl.png"
                    alt="Chart of the American Sign Language fingerspelling alphabet"
                />
            </aside>
        </main>
    </body>
</html>
